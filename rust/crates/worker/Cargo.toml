[package]
name = "quarry-worker"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
lapin = "4.12.3"
pdfium-render = "0.9.5"
pgvector = { version = "0.4.2", features = ["sqlx"] }
quarry-text = { version = "0.1.0", path = "../text" }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
zip = "9.2.2"

[lints]
workspace = true
