name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "fixtures/**", "samples/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "fixtures/**", "samples/**", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always
  PDFIUM_RELEASE: chromium/8111

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Download PDFium
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz" \
            | tar -xz -C "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_LIBRARY_DIR=$RUNNER_TEMP/pdfium/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
