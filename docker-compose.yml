name: quarry

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quarry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quarry}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-quarry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quarry}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build: ./ai
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quarry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quarry}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      UPLOADS_DIR: /data/uploads
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-z-ai/glm-5.3-flash}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-minimal}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - uploads:/data/uploads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      ConnectionStrings__Quarry: Host=postgres;Port=5432;Database=${POSTGRES_DB:-quarry};Username=${POSTGRES_USER:-quarry};Password=${POSTGRES_PASSWORD}
      Auth__DevUserEmail: ${DEV_USER_EMAIL:?set DEV_USER_EMAIL in .env}
      Auth__DevUserPassword: ${DEV_USER_PASSWORD:?set DEV_USER_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      AiService__BaseUrl: http://ai:8000
      AiService__InternalToken: ${INTERNAL_TOKEN}
      Storage__UploadsPath: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
